name: check-listings

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub может запускать с опозданием на несколько минут
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-listings
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_IDS" ]; then echo "Токен ещё не задан — запустите ./setup.sh"; exit 0; fi
          python bot.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          MAX_PRICE: "650"
      # сохраняем список уже отправленных объявлений, чтобы не слать повторно
      - name: save state
        run: |
          git config user.name "listings-bot"
          git config user.email "listings-bot@users.noreply.github.com"
          [ -f data/seen.json ] || exit 0
          git add data/seen.json
          git diff --cached --quiet || (git commit -m "update seen listings" && git push)
