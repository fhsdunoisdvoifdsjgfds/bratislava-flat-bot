<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body { width: 1600px; height: 900px; background: #f1f2f6; color: #0f1422; padding: 64px 70px; }
h1 { font-size: 40px; margin-bottom: 8px; }
.sub { color: #6b7288; font-size: 22px; margin-bottom: 48px; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 28px; }
.c { text-align: center; }
.c .big { width: 236px; height: 236px; border-radius: 50%; display: block; margin: 0 auto 22px; box-shadow: 0 12px 30px rgba(10,20,40,.15); }
.c .row { display: flex; justify-content: center; align-items: center; gap: 14px; margin-bottom: 18px; }
.c .row img { border-radius: 50%; }
.c .sq { width: 64px; height: 64px; border-radius: 16px !important; }
.c b { font-size: 22px; display: block; }
.c span { color: #6b7288; font-size: 17px; font-weight: 600; }
.dark { display: flex; justify-content: center; gap: 10px; margin-top: 14px; padding: 12px; border-radius: 14px; background: #171b24; }
.dark img { width: 44px; height: 44px; border-radius: 50%; }
</style></head><body>
<h1 class="display">Логотипы: 5 вариантов</h1>
<div class="sub">Как они выглядят в Telegram: круглая аватарка, маленький размер в списке чатов, светлая и тёмная тема</div>
<div class="grid">
  <div class="c"><img class="big" src="logo-1-pin.svg"><div class="row"><img src="logo-1-pin.svg" width="56"><img src="logo-1-pin.svg" width="36"><img class="sq" src="logo-1-pin.svg"></div><b>1. Пин с домом</b><span>основной, синий</span><div class="dark"><img src="logo-1-pin.svg"></div></div>
  <div class="c"><img class="big" src="logo-2-castle.svg"><div class="row"><img src="logo-2-castle.svg" width="56"><img src="logo-2-castle.svg" width="36"><img class="sq" src="logo-2-castle.svg"></div><b>2. Град + «новое»</b><span>Братиславский град</span><div class="dark"><img src="logo-2-castle.svg"></div></div>
  <div class="c"><img class="big" src="logo-3-key-chat.svg"><div class="row"><img src="logo-3-key-chat.svg" width="56"><img src="logo-3-key-chat.svg" width="36"><img class="sq" src="logo-3-key-chat.svg"></div><b>3. Ключ в чате</b><span>ключи через Telegram</span><div class="dark"><img src="logo-3-key-chat.svg"></div></div>
  <div class="c"><img class="big" src="logo-4-radar-dark.svg"><div class="row"><img src="logo-4-radar-dark.svg" width="56"><img src="logo-4-radar-dark.svg" width="36"><img class="sq" src="logo-4-radar-dark.svg"></div><b>4. Радар</b><span>тёмный, «сканирует сайты»</span><div class="dark"><img src="logo-4-radar-dark.svg"></div></div>
  <div class="c"><img class="big" src="logo-5-warm-bell.svg"><div class="row"><img src="logo-5-warm-bell.svg" width="56"><img src="logo-5-warm-bell.svg" width="36"><img class="sq" src="logo-5-warm-bell.svg"></div><b>5. Дом + колокольчик</b><span>тёплый, уведомления</span><div class="dark"><img src="logo-5-warm-bell.svg"></div></div>
</div>
</body></html>
